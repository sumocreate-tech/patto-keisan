<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>パッと計算 ― 共テ数学 瞬発トレーニング</title>
<!-- アイコン：このHTMLと同じフォルダに icon.png（180×180以上の正方形PNG推奨）を置く -->
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-title" content="パッと計算">
<meta name="theme-color" content="#f4f1ea">
<style>
  :root{
    --bg:#f4f1ea; --ink:#1f2328; --sub:#6b6f76; --card:#fffdf8; --line:#e2ddd2;
    --accent:#2b59c3; --ok:#1f9d55; --ng:#d64545; --warn:#e0a100;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);
    font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;
    display:flex;justify-content:center;}
  #app{width:100%;max-width:520px;min-height:100%;padding:20px 16px 28px;display:flex;flex-direction:column}
  .screen{display:none;flex:1;flex-direction:column}
  .screen.active{display:flex}

  /* ---------- start ---------- */
  h1{font-size:34px;margin:28px 0 4px;letter-spacing:.04em}
  h1 span{color:var(--accent)}
  .sub{color:var(--sub);margin:0 0 24px;font-size:14px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px 18px;margin-bottom:20px}
  .label{font-size:13px;color:var(--sub);font-weight:700;margin:4px 0 10px}
  .label:not(:first-child){margin-top:18px}
  .seg{display:flex;gap:8px}
  .seg button,.chip{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 0;font-size:16px;font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit}
  .seg button.on,.chip.on{border-color:var(--accent);background:var(--accent);color:#fff}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{flex:0 0 auto;padding:9px 14px;font-size:14px}
  .primary{width:100%;border:none;background:var(--ink);color:#fff;font-size:20px;font-weight:800;padding:18px;border-radius:16px;cursor:pointer;font-family:inherit;letter-spacing:.1em}
  .primary:active{transform:scale(.98)}
  .secondary{width:100%;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-size:16px;font-weight:700;padding:14px;border-radius:16px;cursor:pointer;font-family:inherit;margin-top:10px}
  .best{text-align:center;color:var(--sub);font-size:13px;margin-top:14px;min-height:1em}
  .tip{font-size:12px;color:var(--sub);margin-top:10px;line-height:1.6}
  .modeDesc{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.6}
  .seg button{font-size:15px}
  .custom{display:none;align-items:center;gap:8px;margin-top:10px}
  .custom input{width:110px;font-size:20px;font-weight:700;padding:10px;border:1.5px solid var(--accent);border-radius:12px;font-family:inherit;text-align:center;background:#fff;color:var(--ink)}
  .custom span{font-weight:700}
  .custom small{color:var(--sub);font-size:12px}
  .nameIn{width:100%;font-size:16px;font-weight:700;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;font-family:inherit;background:#fff;color:var(--ink)}
  .rankBox{display:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:16px}
  .rkT{font-size:13px;color:var(--sub);font-weight:700;margin-bottom:6px}
  .rkMe{font-size:17px;font-weight:800;margin:2px 0 8px;line-height:1.5}
  .rkMe em{font-style:normal;color:var(--accent)}
  .rkSub{font-size:13px;color:var(--sub);margin:4px 0 8px}
  .rkRow{display:flex;gap:8px;align-items:center}
  .rkRow .ghost{white-space:nowrap}
  .rkList{margin:0;padding:0;list-style:none}
  .rkList li{display:flex;align-items:baseline;gap:10px;padding:8px 4px;border-top:1px solid var(--line);font-size:15px}
  .rkList li:first-child{border-top:none}
  .rkList .rk{width:44px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--sub)}
  .rkList li:nth-child(-n+3) .rk{color:var(--warn)}
  .rkList .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
  .rkList .rc{font-variant-numeric:tabular-nums;color:var(--ink)}
  .rkList li.me{background:#eef3ff;border-radius:8px}
  .rkList li.gap{justify-content:center;color:var(--sub);padding:2px}
  .boards{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
  .streak{font-size:13px;color:var(--warn);font-weight:800;text-align:center;height:18px;margin-top:-8px;margin-bottom:6px}

  /* ---------- game ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .time{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;min-width:90px}
  .time small{font-size:14px;color:var(--sub);margin-left:2px}
  .time.low{color:var(--ng)}
  .score{font-size:16px;font-weight:700;color:var(--sub)}
  .score b{color:var(--ok);font-size:20px}
  .ghost{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink)}
  .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:12px 0 18px}
  #barFill{height:100%;width:100%;background:var(--accent);border-radius:99px}
  #barFill.low{background:var(--ng)}
  .card{position:relative;background:var(--card);border:2px solid var(--line);border-radius:20px;min-height:200px;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:border-color .1s,background .1s}
  .card.ok{border-color:var(--ok);background:#effaf3}
  .card.ng{border-color:var(--ng);background:#fdf0f0}
  .cat{position:absolute;top:12px;left:14px;font-size:12px;font-weight:700;color:var(--sub);background:var(--bg);padding:3px 9px;border-radius:99px}
  .qno{position:absolute;top:12px;right:14px;font-size:12px;color:var(--sub)}
  .q{font-size:30px;font-weight:600;text-align:center;line-height:1.5;padding-top:14px;font-family:"Times New Roman","Hiragino Mincho ProN","Noto Serif JP",serif}
  .q .ask{display:block;font-size:15px;font-family:"Hiragino Sans","Noto Sans JP",sans-serif;color:var(--sub);margin-top:6px}
  .q .ask b{color:var(--ink)}
  .fig{display:block;width:min(100%,210px);height:auto;color:var(--ink);margin:0 auto 2px}
  .q .ask.g{font-size:17px;color:var(--ink);margin-top:10px;line-height:1.7}
  .rv .rq .fig{width:140px;margin:0 0 2px}
  .mark{position:absolute;right:16px;bottom:8px;font-size:44px;font-weight:900;opacity:0}
  .card.ok .mark{opacity:1;color:var(--ok)}
  .card.ng .mark{opacity:1;color:var(--ng)}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  .choices.cmp{grid-template-columns:1fr 1fr 1fr}
  .choice{min-height:72px;border:2px solid var(--line);background:#fff;border-radius:16px;font-size:24px;font-weight:600;cursor:pointer;color:var(--ink);font-family:"Times New Roman","Hiragino Mincho ProN","Noto Serif JP",serif;display:flex;align-items:center;justify-content:center;padding:6px;position:relative}
  .choices.cmp .choice{font-size:34px;font-family:inherit;min-height:84px}
  .choice:active{transform:scale(.97)}
  .choice.right{border-color:var(--ok);background:var(--ok);color:#fff}
  .choice.wrong{border-color:var(--ng);background:var(--ng);color:#fff}
  .choice .k{position:absolute;top:4px;left:8px;font-size:11px;color:#b3aea3;font-family:sans-serif}
  .choice.right .k,.choice.wrong .k{color:rgba(255,255,255,.7)}

  /* math pieces */
  .fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.8em;margin:0 .12em;line-height:1.15}
  .fr>span:first-child{border-bottom:1.6px solid currentColor;padding:0 .2em .05em}
  .fr>span:last-child{padding:.05em .2em 0}
  .sq{white-space:nowrap}
  .sq .ov{border-top:1.6px solid currentColor;padding:0 .08em 0 .04em;margin-left:-.02em}
  sup{font-size:.6em;vertical-align:.75em;line-height:0}
  sub{font-size:.6em;line-height:0}
  .cmpq{display:inline-flex;align-items:center;gap:.4em;flex-wrap:wrap;justify-content:center}
  .box{display:inline-flex;width:1.3em;height:1.3em;border:2px dashed var(--sub);border-radius:6px;align-items:center;justify-content:center;font-size:.7em;color:var(--sub);font-family:sans-serif}

  /* ---------- result ---------- */
  .resTitle{font-size:16px;color:var(--sub);font-weight:700;text-align:center;margin:22px 0 6px}
  .ring{width:190px;height:190px;margin:0 auto 6px;position:relative}
  .ring svg{transform:rotate(-90deg)}
  .ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .pct b{font-size:46px;font-weight:900;font-variant-numeric:tabular-nums}
  .ring .pct span{font-size:13px;color:var(--sub)}
  .comment{text-align:center;font-weight:700;margin:6px 0 16px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}
  .stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
  .stat span{font-size:11px;color:var(--sub)}
  .newbest{color:var(--warn);font-weight:800;text-align:center;margin-bottom:10px}
  .review{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:16px;max-height:320px;overflow:auto}
  .review h3{font-size:14px;margin:0 0 8px;color:var(--sub)}
  .rv{border-top:1px solid var(--line);padding:10px 0}
  .rv:first-of-type{border-top:none}
  .rv .rq{font-size:20px;font-family:"Times New Roman","Hiragino Mincho ProN",serif;margin-bottom:4px}
  .rv .rq .ask{font-size:12px;color:var(--sub);font-family:sans-serif;margin-left:6px}
  .rv .ra{font-size:14px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .rv .ra .y{color:var(--ng)}
  .rv .ra .c{color:var(--ok);font-weight:700}
  .rv .ra .v{font-family:"Times New Roman","Hiragino Mincho ProN",serif;font-size:18px}
  .empty{color:var(--sub);font-size:14px;text-align:center;padding:8px}
</style>
</head>
<body>
<div id="app">

  <!-- START -->
  <section id="start" class="screen active">
    <h1>パッと<span>計算</span></h1>
    <p class="sub">共テ数学の「うっかりミス」をなくす瞬発トレーニング</p>
    <div class="panel">
      <div class="label">モード</div>
      <div class="seg" id="modeSeg">
        <button data-m="ta" class="on">タイムアタック</button>
        <button data-m="endless">エンドレス</button>
      </div>
      <div class="modeDesc" id="modeDesc"></div>
      <div id="timeWrap">
      <div class="label">制限時間</div>
      <div class="seg" id="timeSeg">
        <button data-t="30" class="on">30秒</button>
        <button data-t="60">60秒</button>
        <button data-t="90">90秒</button>
        <button data-t="custom">カスタム</button>
      </div>
      <div class="custom" id="timeCustom"><input id="timeInput" type="number" inputmode="numeric" min="5" max="600" value="45"><span>秒</span><small>5〜600秒</small></div>
      </div>
      <div id="qWrap" style="display:none">
      <div class="label">1問あたりの制限時間</div>
      <div class="seg" id="qSeg">
        <button data-t="10" class="on">10秒</button>
        <button data-t="20">20秒</button>
        <button data-t="30">30秒</button>
        <button data-t="custom">カスタム</button>
      </div>
      <div class="custom" id="qCustom"><input id="qInput" type="number" inputmode="numeric" min="2" max="60" value="8"><span>秒</span><small>2〜60秒</small></div>
      </div>
      <div class="label">出題ジャンル</div>
      <div class="chips" id="cats"></div>
      <div class="label">なまえ（ランキング用）</div>
      <input id="nameInput" class="nameIn" maxlength="12" placeholder="未入力だと「名無し」で登録" autocomplete="off">
      <div class="tip">「終了」でいつでもやめられるよ。ランキング対象はカスタム以外の時間設定です。</div>
    </div>
    <button id="startBtn" class="primary">スタート</button>
    <button id="rankBtn" class="secondary">🏆 ランキングを見る</button>
    <p class="best" id="best"></p>
  </section>

  <!-- GAME -->
  <section id="game" class="screen">
    <div class="top">
      <div class="time" id="time"><span id="sec">30.0</span><small>秒</small></div>
      <div class="score"><b id="cCount">0</b> / <span id="aCount">0</span> 問</div>
      <button id="quitBtn" class="ghost">終了</button>
    </div>
    <div class="bar"><div id="barFill"></div></div>
    <div class="streak" id="streak"></div>
    <div class="card" id="card">
      <div class="cat" id="qCat"></div>
      <div class="qno" id="qNo"></div>
      <div class="q" id="qText"></div>
      <div class="mark" id="mark"></div>
    </div>
    <div class="choices" id="choices"></div>
  </section>

  <!-- RANKING -->
  <section id="ranking" class="screen">
    <div class="resTitle">🏆 ランキング</div>
    <div class="boards" id="boards"></div>
    <div class="rankBox" id="rkMain" style="display:block"></div>
    <button id="rkBack" class="secondary">設定に戻る</button>
  </section>

  <!-- RESULT -->
  <section id="result" class="screen">
    <div class="resTitle" id="resTitle">結果</div>
    <div class="ring">
      <svg width="190" height="190" viewBox="0 0 190 190">
        <circle cx="95" cy="95" r="80" fill="none" stroke="#e2ddd2" stroke-width="14"/>
        <circle id="ringArc" cx="95" cy="95" r="80" fill="none" stroke="#1f9d55" stroke-width="14" stroke-linecap="round" stroke-dasharray="502.65" stroke-dashoffset="502.65" style="transition:stroke-dashoffset .9s ease"/>
      </svg>
      <div class="pct"><b id="pct">0%</b><span>正答率</span></div>
    </div>
    <div class="comment" id="comment"></div>
    <div class="newbest" id="newBest"></div>
    <div class="stats">
      <div class="stat"><b id="sCorrect">0</b><span>正解</span></div>
      <div class="stat"><b id="sAns">0</b><span>解答数</span></div>
      <div class="stat"><b id="sPace">-</b><span id="sPaceL">1問あたり(秒)</span></div>
    </div>
    <div class="rankBox" id="rankBox"></div>
    <div class="review" id="review"></div>
    <button id="retryBtn" class="primary">もう一度</button>
    <button id="backBtn" class="secondary">設定に戻る</button>
  </section>
</div>

<script>
/* ================= online ranking (Google Apps Script + スプレッドシート) ================= */
// ★ Apps Script を「ウェブアプリ」として公開して出るURLをここに貼る（空のままならランキング無効）
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxQI1jAyWM8ULFsYEOoycMYdgP1bdvYFVabvojEqP_03dcAZFkvqEvJqoUUGMmWLy-DWA/exec';
const BOARDS=[['ta30','タイムアタック：30秒'],['ta60','タイムアタック：60秒'],['ta90','タイムアタック：90秒'],
              ['en10','エンドレス：1問10秒'],['en20','エンドレス：1問20秒'],['en30','エンドレス：1問30秒']];
const BTITLE=Object.fromEntries(BOARDS);

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const M = '−';
const ri = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const pick = a => a[Math.floor(Math.random()*a.length)];
const nz = (a,b) => { let x; do { x = ri(a,b); } while (x === 0); return x; };
const gcd = (a,b) => { a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a; };
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

const n2  = n => n<0 ? M+(-n) : ''+n;                 // 数
const par = n => n<0 ? '('+M+(-n)+')' : ''+n;         // 負なら括弧
const frx = (a,b) => `<span class="fr"><span>${a}</span><span>${b}</span></span>`;
function fr(n,d){                                      // 約分した分数
  if (d<0){ n=-n; d=-d; }
  if (n===0) return '0';
  const g=gcd(n,d); n/=g; d/=g;
  if (d===1) return n2(n);
  return (n<0?M:'') + frx(Math.abs(n), d);
}
const sq = m => `<span class="sq">√<span class="ov">${m}</span></span>`;
function simp(m){ let c=1, r=m; for(let i=2;i*i<=r;i++){ while(r%(i*i)===0){ r/=i*i; c*=i; } } return [c,r]; }
function surd(k,m){                                    // k√m を簡約して表示
  if (k===0) return '0';
  const [c,r]=simp(m); k*=c;
  if (r===1) return n2(k);
  const a=Math.abs(k);
  return (k<0?M:'') + (a===1?'':a) + sq(r);
}
const raw = (k,m) => (k===1?'':k) + sq(m);             // 簡約しない k√m
const lg  = (b,x) => `log<sub>${b}</sub>${x}`;
const pw  = (b,e) => `${b}<sup>${e}</sup>`;
const isPow = (x,b) => { while(x>1 && x%b===0) x/=b; return x===1; };

function mc(cat, q, ans, ds, filler){
  const ch=[ans];
  for (const d of ds){ if (d!=null && !ch.includes(d) && ch.length<4) ch.push(d); }
  let t=0;
  while (ch.length<4 && t++<80){ const d=filler(); if (d!=null && !ch.includes(d)) ch.push(d); }
  shuffle(ch);
  return { cat, type:'mc', q, choices:ch, answer:ch.indexOf(ans) };
}

/* ================= generators ================= */
// 正負・累乗・割り算
function gSign(){
  const t=ri(0,2);
  if (t===0){
    const a=nz(-9,9), b=ri(2,9), c=nz(-9,9), ans=a-b*c;
    return mc('計算', `${n2(a)} − ${b} × ${par(c)}`, n2(ans),
      [n2((a-b)*c), n2(a+b*c), n2(-ans)], ()=>n2(ans+nz(-6,6)));
  }
  if (t===1){
    const a=ri(2,7), b=ri(2,7), ans=-a*a+b*b;
    return mc('計算', `${M}${a}<sup>2</sup> + (${M}${b})<sup>2</sup>`, n2(ans),
      [n2(a*a+b*b), n2(-a*a-b*b), n2(a*a-b*b)], ()=>n2(ans+nz(-5,5)));
  }
  const y=nz(-6,6), w=nz(-6,6), z=nz(-5,5), x=y*w, ans=w*z;
  return mc('計算', `${n2(x)} ÷ ${par(y)} × ${par(z)}`, n2(ans),
    [fr(x,y*z), n2(-ans), n2(w+z)], ()=>n2(ans+nz(-6,6)));
}
// 分数
function gFrac(){
  let q1=ri(2,9), q2; do { q2=ri(2,9); } while(q2===q1);
  const p1=ri(1,q1+2), p2=ri(1,q2+2);
  if (Math.random()<0.65){
    const s=pick([1,-1]);
    const ans=fr(p1*q2+s*p2*q1, q1*q2);
    return mc('計算', `${fr(p1,q1)} ${s>0?'+':'−'} ${fr(p2,q2)}`, ans,
      [fr(p1+s*p2, q1+q2), fr(p1*q2-s*p2*q1, q1*q2), fr(p1+s*p2, q1*q2)],
      ()=>fr(p1*q2+s*p2*q1+nz(-3,3), q1*q2));
  }
  const ans=fr(p1*q2, q1*p2);
  return mc('計算', `${fr(p1,q1)} ÷ ${fr(p2,q2)}`, ans,
    [fr(p1*p2, q1*q2), fr(q1*p2, p1*q2), fr(p1*q2+1, q1*p2)],
    ()=>fr(ri(1,15), ri(2,12)));
}
// 展開
function gExpand(){
  const p=pick([1,1,1,2,3]), q=pick([1,1,2,3]), a=nz(-6,6), b=nz(-6,6);
  const tx=c=>c===1?'x':c+'x', tc=c=>c<0?` − ${-c}`:` + ${c}`;
  const expr=`(${tx(p)}${tc(a)})(${tx(q)}${tc(b)})`;
  if (Math.random()<0.7){
    const ans=p*b+q*a;
    return mc('計算', `${expr}<span class="ask">を展開したときの <b>x の係数</b></span>`, n2(ans),
      [n2(p*a+q*b), n2(a+b), n2(-ans), n2(a*b)], ()=>n2(ans+nz(-4,4)));
  }
  const ans=a*b;
  return mc('計算', `${expr}<span class="ask">を展開したときの <b>定数項</b></span>`, n2(ans),
    [n2(-ans), n2(a+b), n2(p*q*a*b===ans?ans+p:p*q*a*b)], ()=>n2(ans+nz(-5,5)));
}
// ルート
function gSqrt(){
  const t=ri(0,2);
  if (t===0){
    const m=pick([2,3,5,6,7]), kmax=(m>=6?3:4);
    let k1,k2; do { k1=ri(1,kmax); k2=ri(1,kmax); } while(k1===k2 || Math.max(k1,k2)<2);
    const s=pick([1,-1]);
    if (s<0 && k1<k2) [k1,k2]=[k2,k1];
    const a=k1*k1*m, b=k2*k2*m;
    return mc('ルート', `${sq(a)} ${s>0?'+':'−'} ${sq(b)}`, surd(k1+s*k2, m),
      [surd(1, a+s*b), surd(k1-s*k2, m), surd(k1+s*k2+1, m), surd(k1*k2, m)],
      ()=>surd(nz(-5,7), m));
  }
  if (t===1){
    const P=[2,3,5,6,7,8,10,12,14,15,18,20,21];
    let a,b; do { a=pick(P); b=pick(P); } while(a===b || simp(a*b)[0]===1);
    const [c,r]=simp(a*b);
    return mc('ルート', `${sq(a)} × ${sq(b)}`, surd(1,a*b),
      [surd(1,a+b), surd(c+1,r), c>1?surd(c-1,r):null, surd(c*2,r)],
      ()=>surd(ri(1,8), pick([1,2,3,5,6,7,10])));
  }
  const m=pick([2,3,5,6]), k=ri(1,4), n=m*k;
  return mc('ルート', frx(n, sq(m)), surd(k,m),
    [surd(n,m), n2(k), surd(1,n), surd(k+1,m)], ()=>surd(ri(1,6), m));
}
// 指数
function gPow(){
  if (Math.random()<0.55){
    const B=pick([2,3]), lo=B===2?-3:-2, hi=B===2?5:3;
    let a,b,c,k; do { a=ri(-2,4); b=ri(-2,4); c=ri(-2,4); k=a+b-c; } while(k<lo||k>hi||a===0||b===0||c===0);
    const val=e=> e>=0 ? n2(B**e) : fr(1, B**(-e));
    const ok=e=> e>=-4 && e<=6;
    return mc('指数・対数', `${pw(B,n2(a))} × ${pw(B,n2(b))} ÷ ${pw(B,n2(c))}`, val(k),
      [a*b-c, a+b+c, -k, k+1].filter(ok).map(val),
      ()=>{ const e=k+nz(-3,3); return ok(e)?val(e):null; });
  }
  const T=[[8,2,3],[27,2,3],[16,3,4],[4,3,2],[9,3,2],[32,2,5],[8,-1,3],[9,-1,2],[16,-1,2],[27,-2,3],[64,2,3],[25,3,2],[16,-3,4],[4,-3,2]];
  const [base,num,den]=pick(T), root=Math.round(base**(1/den)), an=Math.abs(num);
  const ans = num>=0 ? n2(root**num) : fr(1, root**an);
  const ex = (num<0?M:'') + an + '/' + den;
  return mc('指数・対数', pw(base, ex), ans,
    [num>=0 ? fr(1,root**an) : n2(root**an), n2(root**(an+1)), fr(base*an, den), n2(root*an)],
    ()=>n2(ri(2,30)));
}
// 対数
function gLog(){
  const t=ri(0,3);
  if (t<=1){
    const b=pick([2,3]), tt=pick(b===2?[3,5,6,7,10]:[2,4,5,7,10]), k=ri(1, b===2?3:2);
    const q = t===0 ? `${lg(b,tt*b**k)} − ${lg(b,tt)}` : `${lg(b,tt)} + ${lg(b,fr(b**k,tt))}`;
    return mc('指数・対数', q, n2(k), [n2(k+1), n2(-k), n2(b**k), n2(2*k), n2(k-1)], ()=>n2(k+nz(-3,3)));
  }
  if (t===2){
    const E=[[2,2,3],[3,2,3],[2,3,2],[2,3,1],[2,2,1],[3,3,2],[2,4,3],[2,-1,3],[3,-1,2],[2,3,4],[5,2,1],[2,-2,3]];
    const [p,a,c]=pick(E);
    const base = a>0 ? ''+p**a : '1/'+p**(-a);
    return mc('指数・対数', lg(base, p**c), fr(c,a),
      [fr(a,c), fr(-c,a), fr(c+1,a), n2(c)], ()=>fr(nz(-4,4), ri(1,4)));
  }
  const E=[[2,fr(1,8),-3,1],[3,fr(1,9),-2,1],[2,sq(2),1,2],[3,sq(3),1,2],[2,'4'+sq(2),5,2],[3,'3'+sq(3),3,2],[5,fr(1,25),-2,1],[2,frx(1,sq(2)),-1,2],[10,'0.01',-2,1],[10,'1000',3,1]];
  const [b,x,n,d]=pick(E);
  return mc('指数・対数', lg(b,x), fr(n,d), [fr(-n,d), fr(d,n), fr(-d,n), fr(n+d,d)], ()=>fr(nz(-4,4), ri(1,2)));
}
// 三角比
const HALF=frx(1,2), R2=frx(sq(2),2), R3=frx(sq(3),2), I3=frx(1,sq(3));
const SC=[[0,'0'],[.5,HALF],[Math.SQRT2/2,R2],[Math.sqrt(3)/2,R3],[1,'1']];
const TN=[[0,'0'],[1/Math.sqrt(3),I3],[1,'1'],[Math.sqrt(3),sq(3)]];
function tv(v,tab){
  const a=Math.abs(v);
  for (const [x,h] of tab){ if (Math.abs(a-x)<1e-9) return (v<-1e-9 && h!=='0' ? M : '') + h; }
  return null;
}
function gTrig(){
  const angs=[0,30,45,60,90,120,135,150,180,210,225,240,270,300,315,330];
  const f=pick(['sin','cos','sin','cos','tan']);
  let ang; do { ang=pick(angs); } while(f==='tan' && (ang===90||ang===270));
  const r=ang*Math.PI/180;
  const s=Math.sin(r), c=Math.cos(r);
  const tab = f==='tan' ? TN : SC;
  const v = f==='sin' ? s : f==='cos' ? c : s/c;
  const other = f==='sin' ? tv(c,SC) : f==='cos' ? tv(s,SC) : (Math.abs(v)>1e-9 ? tv(1/v,TN) : null);
  return mc('三角比', `${f} ${ang}°`, tv(v,tab), [tv(-v,tab), other],
    ()=>{ const [x,h]=pick(tab); return (Math.random()<.5 && h!=='0' ? M : '') + h; });
}
// 大小比較
function gCmp(){
  const t=ri(0,5); let L,R,lv,rv;
  if (t===0){
    const ms=[2,3,5,6,7];
    if (Math.random()<.2){ const k=ri(2,4), m=pick(ms); L=raw(k,m); R=sq(k*k*m); lv=k*Math.sqrt(m); rv=Math.sqrt(k*k*m); }
    else {
      let k1,m1,k2,m2;
      do { k1=ri(1,5); m1=pick(ms); k2=ri(1,5); m2=pick(ms); lv=k1*Math.sqrt(m1); rv=k2*Math.sqrt(m2); }
      while (m1===m2 || k1*k1*m1===k2*k2*m2 || Math.abs(lv-rv)/Math.max(lv,rv)>0.2);
      L=raw(k1,m1); R=raw(k2,m2);
    }
  } else if (t===1){
    const b=pick([2,3]); let x,n;
    if (Math.random()<.2){ n=ri(2, b===2?5:3); x=b**n; }
    else { do { x=ri(3, b===2?60:80); } while(isPow(x,b)); n=Math.round(Math.log(x)/Math.log(b)); }
    L=lg(b,x); R=''+n; lv=Math.log(x)/Math.log(b); rv=n;
  } else if (t===2){
    if (Math.random()<.2){
      const E=[[4,9,2,3],[9,4,3,2],[8,27,2,3],[4,25,2,5],[9,25,3,5],[8,125,2,5]];
      const [a1,b1,a2,b2]=pick(E); L=lg(a1,b1); R=lg(a2,b2);
      lv=Math.log(b1)/Math.log(a1); rv=Math.log(b2)/Math.log(a2);
    } else {
      let a1,b1,a2,b2;
      do { a1=ri(2,9); b1=ri(2,9); a2=ri(2,9); b2=ri(2,9);
           lv=Math.log(b1)/Math.log(a1); rv=Math.log(b2)/Math.log(a2); }
      while (a1===b1 || a2===b2 || (a1===a2&&b1===b2) || Math.abs(lv-rv)<1e-9 || Math.abs(lv-rv)>0.5);
      L=lg(a1,b1); R=lg(a2,b2);
    }
  } else if (t===3){
    let p,q,r,s;
    do { q=ri(3,13); s=ri(3,13); p=ri(1,q-1); r=ri(1,s-1); lv=p/q; rv=r/s; }
    while (q===s || gcd(p,q)!==1 || gcd(r,s)!==1 || Math.abs(lv-rv)>0.08);
    L=frx(p,q); R=frx(r,s);
  } else if (t===4){
    if (Math.random()<.15){
      const E=[[2,2,4,4],[3,2,9,4],[2,3,4,6],[5,2,25,4]];
      const [a,m,b,n]=pick(E); L=pw(a,'1/'+m); R=pw(b,'1/'+n); lv=a**(1/m); rv=b**(1/n);
    } else {
      let a,m,b,n;
      do { a=ri(2,10); b=ri(2,10); m=ri(2,5); n=ri(2,5); lv=a**(1/m); rv=b**(1/n); }
      while (m===n || Math.abs(lv-rv)<1e-9 || Math.abs(lv-rv)>0.3);
      L=pw(a,'1/'+m); R=pw(b,'1/'+n);
    }
  } else {
    const squares=[4,9];
    let s,a,c;
    do { s=ri(8,14); a=ri(2,Math.floor((s-1)/2)); c=ri(2,Math.floor((s-1)/2)); }
    while (a===c || [a,s-a,c,s-c].some(v=>squares.includes(v)));
    L=`${sq(a)} + ${sq(s-a)}`; R=`${sq(c)} + ${sq(s-c)}`;
    lv=Math.sqrt(a)+Math.sqrt(s-a); rv=Math.sqrt(c)+Math.sqrt(s-c);
  }
  if (Math.random()<.5){ [L,R]=[R,L]; [lv,rv]=[rv,lv]; }
  const d=lv-rv, ans = Math.abs(d)<1e-9 ? 2 : d>0 ? 0 : 1;
  return { cat:'大小比較', type:'cmp', q:`<span class="cmpq">${L}<span class="box">?</span>${R}</span>`,
           choices:['＞','＜','＝'], answer:ans, L, R };
}

// 図形（相似・長さの比）
const TA=[110,18], TB=[22,138], TC=[210,138];
const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];
const f1=v=>v.toFixed(1);
const svgf=(w,h,body)=>`<svg class="fig" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" font-family="Times New Roman,serif" font-size="16" font-style="italic">${body}</svg>`;
const ln=(a,b)=>`<line x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}" stroke="currentColor" stroke-width="1.8"/>`;
const dotp=p=>`<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="2.8" fill="currentColor"/>`;
const lab=(p,t,dx,dy)=>`<text x="${f1(p[0]+dx)}" y="${f1(p[1]+dy)}" text-anchor="middle" fill="currentColor">${t}</text>`;
const poly=pts=>`<polygon points="${pts.map(p=>f1(p[0])+','+f1(p[1])).join(' ')}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>`;
const triFig=extra=>svgf(232,168, poly([TA,TB,TC])+extra+lab(TA,'A',0,-7)+lab(TB,'B',-10,16)+lab(TC,'C',10,16));
const rt=(a,b)=>{ const g=gcd(a,b); return `${a/g}:${b/g}`; };
const ask=t=>`<span class="ask g">${t}</span>`;
const pos=x=>n2(Math.max(1,x));

// 平行線と比（DE∥BC）
function gGeoPar(){
  const P=[[1,2],[2,1],[1,3],[3,1],[2,3],[3,2],[3,4],[2,5],[4,3]];
  const [m,n]=pick(P), k=ri(1,3), j=ri(1,4), t=m/(m+n);
  const D=lerp(TA,TB,t), E=lerp(TA,TC,t);
  const fig=triFig(ln(D,E)+dotp(D)+dotp(E)+lab(D,'D',-12,4)+lab(E,'E',12,4));
  const v=ri(0,3), AD=m*k, DB=n*k;
  if (v===0){
    const ans=m*j;
    return mc('図形', fig+ask(`DE ∥ BC、AD=${AD}、DB=${DB}、BC=${(m+n)*j}<br>のとき <b>DE</b> の長さ`), n2(ans),
      [n2(n*j), n2((m+n)*j), n2(ans+k)], ()=>pos(ans+nz(-3,3)));
  }
  if (v===1){
    const ans=m*j;
    return mc('図形', fig+ask(`DE ∥ BC、AD=${AD}、DB=${DB}、AC=${(m+n)*j}<br>のとき <b>AE</b> の長さ`), n2(ans),
      [n2(n*j), n2((m+n)*j), n2(ans+k)], ()=>pos(ans+nz(-3,3)));
  }
  if (v===2){
    const ans=n*j;
    return mc('図形', fig+ask(`DE ∥ BC、AD=${AD}、DB=${DB}、AE=${m*j}<br>のとき <b>EC</b> の長さ`), n2(ans),
      [n2(m*j), n2((m+n)*j), n2(ans+k)], ()=>pos(ans+nz(-3,3)));
  }
  return mc('図形', fig+ask(`DE ∥ BC、AD : DB = ${m} : ${n}<br>のとき <b>DE : BC</b>`), rt(m,m+n),
    [rt(m,n), rt(n,m+n), rt(m+n,m)], ()=>rt(ri(1,9),ri(2,12)));
}
// 角の二等分線
function gGeoBis(){
  const P=[[1,2],[2,1],[2,3],[3,2],[1,3],[3,1],[3,4],[4,3],[2,5],[5,2]];
  const [m,n]=pick(P); let k,j;
  do { k=ri(2,4); j=ri(1,3); } while (!(Math.abs(m-n)*k<(m+n)*j && j<k));
  const D=lerp(TB,TC,m/(m+n));
  const fig=triFig(ln(TA,D)+dotp(D)+lab(D,'D',0,18));
  const given=`AD は ∠A の二等分線、AB=${m*k}、AC=${n*k}、BC=${(m+n)*j}<br>のとき `;
  if (Math.random()<.5){
    const ans=m*j;
    return mc('図形', fig+ask(given+'<b>BD</b> の長さ'), n2(ans), [n2(n*j), n2((m+n)*j), n2(ans+1)], ()=>pos(ans+nz(-3,3)));
  }
  const ans=n*j;
  return mc('図形', fig+ask(given+'<b>DC</b> の長さ'), n2(ans), [n2(m*j), n2((m+n)*j), n2(ans+1)], ()=>pos(ans+nz(-3,3)));
}
// 中点連結定理・重心
function gGeoMid(){
  const v=ri(0,3);
  if (v<=1){
    const D=lerp(TA,TB,.5), E=lerp(TA,TC,.5), x=ri(2,9);
    const fig=triFig(ln(D,E)+dotp(D)+dotp(E)+lab(D,'D',-12,4)+lab(E,'E',12,4));
    if (v===0) return mc('図形', fig+ask(`D, E はそれぞれ AB, AC の中点、BC=${2*x}<br>のとき <b>DE</b> の長さ`), n2(x), [n2(2*x), n2(4*x), n2(x+2)], ()=>pos(x+nz(-3,3)));
    return mc('図形', fig+ask(`D, E はそれぞれ AB, AC の中点、DE=${x}<br>のとき <b>BC</b> の長さ`), n2(2*x), [n2(x), n2(4*x), n2(x*3)], ()=>pos(2*x+nz(-3,3)));
  }
  const D=lerp(TB,TC,.5), G=lerp(TA,D,2/3), k=ri(2,7);
  const fig=triFig(ln(TA,D)+dotp(D)+dotp(G)+lab(D,'D',0,18)+lab(G,'G',12,4));
  if (v===2) return mc('図形', fig+ask(`G は △ABC の重心、D は BC の中点、AD=${3*k}<br>のとき <b>AG</b> の長さ`), n2(2*k), [n2(k), n2(3*k-1), n2(4*k)], ()=>pos(2*k+nz(-3,3)));
  return mc('図形', fig+ask(`G は △ABC の重心、D は BC の中点、AG=${2*k}<br>のとき <b>GD</b> の長さ`), n2(k), [n2(2*k), n2(4*k), n2(3*k)], ()=>pos(k+nz(-3,3)));
}
// 相似比・面積比・体積比
function gGeoSim(){
  let m,n; do { m=ri(1,5); n=ri(1,5); } while (m===n || gcd(m,n)!==1);
  const v=ri(0,3), mx=Math.max(m,n);
  const mk=(ox,s)=>[[0,0],[1.2,0],[0.4,-0.9]].map(p=>[ox+p[0]*s, 105+p[1]*s]);
  const f=90/mx;
  const trFig=svgf(260,128, poly(mk(10,f*m))+poly(mk(140,f*n))
    + lab([10+0.6*f*m,0],'△ABC',0,122) + lab([140+0.6*f*n,0],'△DEF',0,122));
  const spFig=svgf(260,120,
    `<circle cx="65" cy="60" r="${f1(45*m/mx)}" fill="none" stroke="currentColor" stroke-width="1.8"/>`+
    `<circle cx="190" cy="60" r="${f1(45*n/mx)}" fill="none" stroke="currentColor" stroke-width="1.8"/>`);
  const rnd=()=>rt(ri(1,25),ri(1,25));
  if (v===0) return mc('図形', trFig+ask(`△ABC ∽ △DEF、相似比 ${m} : ${n}<br>のとき <b>面積比</b>`), rt(m*m,n*n),
    [rt(m,n), rt(m**3,n**3), rt(n*n,m*m)], rnd);
  if (v===1){
    const c=ri(1,6), ans=n*n*c;
    return mc('図形', trFig+ask(`△ABC ∽ △DEF、相似比 ${m} : ${n}、△ABC=${m*m*c}<br>のとき <b>△DEF</b> の面積`), n2(ans),
      [n2(m*n*c), n2(n*c), n2(m*m*n*c)], ()=>pos(ans+nz(-9,9)));
  }
  if (v===2) return mc('図形', spFig+ask(`相似比 ${m} : ${n} の2つの球<br>のとき <b>体積比</b>`), rt(m**3,n**3),
    [rt(m,n), rt(m*m,n*n), rt(n**3,m**3)], rnd);
  return mc('図形', trFig+ask(`△ABC ∽ △DEF、面積比 ${m*m} : ${n*n}<br>のとき <b>相似比</b>`), rt(m,n),
    [rt(m*m,n*n), rt(n,m), rt(m**3,n**3)], rnd);
}
// 方べきの定理（円の2弦）
function gGeoPow(){
  const cx=110, cy=85, r=66;
  const pt=a=>[cx+r*Math.cos(a*Math.PI/180), cy-r*Math.sin(a*Math.PI/180)];
  const A=pt(205), B=pt(35), C=pt(130), D=pt(315);
  const [x1,y1]=A,[x2,y2]=B,[x3,y3]=C,[x4,y4]=D;
  const den=(x1-x2)*(y3-y4)-(y1-y2)*(x3-x4);
  const px=((x1*y2-y1*x2)*(x3-x4)-(x1-x2)*(x3*y4-y3*x4))/den;
  const py=((x1*y2-y1*x2)*(y3-y4)-(y1-y2)*(x3*y4-y3*x4))/den;
  const P=[px,py], out=(p,t)=>lab(p,t,(p[0]-cx)*0.22,(p[1]-cy)*0.22+5);
  const fig=svgf(220,170,
    `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="currentColor" stroke-width="1.8"/>`+
    ln(A,B)+ln(C,D)+dotp(P)+out(A,'A')+out(B,'B')+out(C,'C')+out(D,'D')+lab(P,'P',13,5));
  const c=ri(2,6), d=ri(2,6), pr=c*d, dv=[];
  for (let a=2;a<=pr/2;a++) if (pr%a===0) dv.push(a);
  const a=pick(dv), b=pr/a;
  return mc('図形', fig+ask(`円の弦 AB, CD が点 P で交わる。<br>PA=${a}、PB=${b}、PC=${c} のとき <b>PD</b> の長さ`), n2(d),
    [pos(a+b-c), n2(a*b), pos(d+2)], ()=>pos(d+nz(-3,3)));
}

  catsEl.appendChild(b);
}
const clampN=(v,lo,hi,def)=>{ v=Math.round(+v); if(!isFinite(v)||v<=0) v=def; return Math.min(hi,Math.max(lo,v)); };
const getDur=()=> tSel==='custom' ? clampN($('#timeInput').value,5,600,45) : +tSel;
const getQL =()=> qSel==='custom' ? clampN($('#qInput').value,2,60,8) : +qSel;
function bindSeg(segId, customId, inputId, onSel, getter){
  const btns=document.querySelectorAll(`#${segId} button`), cu=$('#'+customId), inp=$('#'+inputId);
  btns.forEach(b=>{
    b.onclick=()=>{
      btns.forEach(x=>x.classList.remove('on')); b.classList.add('on');
      onSel(b.dataset.t); cu.style.display = b.dataset.t==='custom' ? 'flex' : 'none'; showBest();
    };
  });
  inp.oninput=showBest;
  inp.onchange=()=>{ inp.value=getter(); showBest(); };
}
bindSeg('timeSeg','timeCustom','timeInput',v=>{tSel=v;},getDur);
bindSeg('qSeg','qCustom','qInput',v=>{qSel=v;},getQL);
document.querySelectorAll('#modeSeg button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); mode=b.dataset.m; updateMode();
  };
});
function updateMode(){
  $('#timeWrap').style.display = mode==='ta' ? '' : 'none';
  $('#qWrap').style.display = mode==='ta' ? 'none' : '';
  $('#modeDesc').textContent = mode==='ta'
    ? '制限時間内にどれだけ多く正解できるか挑戦。'
    : '1問ごとの制限時間内に答える。時間切れは不正解扱いで次の問題へ。「終了」を押すまで続くよ。';
  showBest();
}
const ekey=q=> q===10 ? 'patto_best_endless' : 'patto_best_endless_'+q;
function showBest(){
  if (mode==='ta'){
    const d=getDur(), bst=store.get('patto_best_'+d);
    $('#best').textContent = bst ? `${d}秒のベスト：${bst.c}問正解（正答率 ${bst.p}%）` : '';
  } else {
    const bst=store.get(ekey(getQL()));
    $('#best').textContent = bst ? `エンドレス(1問${getQL()}秒)のベスト：${bst}問連続正解` : '';
  }
}
updateMode();

/* ---- ranking ---- */
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sbOn=()=>!!GAS_URL;
const cleanName=v=>String(v||'').trim().slice(0,12).replace(/^[=+\-@]+/,'');
const getName=()=> cleanName(store.get('patto_name'));
const setName=v=>{ store.set('patto_name',cleanName(v)); };
const fmtRec=(b,sc)=> b.startsWith('ta') ? `${sc}問` : `${sc}問連続`;
let gameBoard=null;

async function fetchBoard(b){
  const r=await fetch(`${GAS_URL}?board=${b}`);
  if (!r.ok) throw new Error('HTTP '+r.status);
  return await r.json();   // 同じ名前でも別々に載せる
}
const myIdx=(list,name,ref)=> ref
  ? list.findIndex(x=>x.name===name && x.score===ref.s && x.acc===ref.a)   // 今回の記録の位置
  : list.findIndex(x=>x.name===name);                                       // 自分の名前の最上位
function listHTML(list,b,name,limit,ref){
  const top=list.slice(0,limit), mi=myIdx(list,name,ref);
  const isMe=(x,i)=> ref ? i===mi : x.name===name;
  let h=top.map((x,i)=>`<li class="${isMe(x,i)?'me':''}"><span class="rk">${i+1}位</span><span class="nm">${esc(x.name)}</span><span class="rc">記録「${fmtRec(b,x.score)}」</span></li>`).join('');
  if (mi>=limit){ h+=`<li class="gap">⋮</li><li class="me"><span class="rk">${mi+1}位</span><span class="nm">${esc(name)}</span><span class="rc">記録「${fmtRec(b,list[mi].score)}」</span></li>`; }
  return `<ul class="rkList">${h||'<li class="gap">まだ記録がありません</li>'}</ul>`;
}
async function rankFlow(score,acc,board){
  const box=$('#rankBox'); box.style.display='block';
  const head=`<div class="rkT">${BTITLE[board]}</div>`;
  const name=getName() || '名無し';   // 名前未入力でも必ず登録する
  box.innerHTML=head+'<div class="rkSub">ランキングに登録中…</div>';
  try{
    // 毎回の記録を無条件で登録する（失敗分は端末に保存して次回まとめて再送）
    const pend=store.get('patto_pending')||[];
    pend.push({board,name,score,acc});
    store.set('patto_pending',pend);
    while (pend.length){
      const r=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(pend[0])});
      if (!r.ok || !(await r.json()).ok) throw new Error('post failed');
      pend.shift(); store.set('patto_pending',pend);
    }
    const ref={s:score,a:acc}, list=await fetchBoard(board), mi=myIdx(list,name,ref);
    const me = mi>=0 ? `${esc(name)}　記録「${fmtRec(board,score)}」<em>${mi+1}位</em>` : `${esc(name)}　記録「${fmtRec(board,score)}」<em>圏外</em>`;
    box.innerHTML=head+`<div class="rkMe">${me}</div>`+listHTML(list,board,name,5,ref);
  }catch(e){
    box.innerHTML=head+'<div class="rkSub">ランキングに接続できませんでした（通信状況を確認してね）</div>';
  }
}
async function openRanking(b){
  show('ranking');
  const bx=$('#boards');
  if (!bx.children.length){
    BOARDS.forEach(([k,t])=>{ const c=document.createElement('button'); c.className='chip'; c.dataset.b=k; c.textContent=t.replace('タイムアタック：','TA ').replace('エンドレス：1問','エンドレス '); c.onclick=()=>loadBoard(k); bx.appendChild(c); });
  }
  loadBoard(b);
}
async function loadBoard(b){
  document.querySelectorAll('#boards .chip').forEach(c=>c.classList.toggle('on',c.dataset.b===b));
  const box=$('#rkMain'), head=`<div class="rkT">${BTITLE[b]}</div>`;
  if (!sbOn()){ box.innerHTML=head+'<div class="rkSub">ランキングはまだ設定されていません</div>'; return; }
  box.innerHTML=head+'<div class="rkSub">読み込み中…</div>';
  try{
    const list=await fetchBoard(b);
    if ($('#boards .chip.on')?.dataset.b!==b) return;   // 切り替え済みなら破棄
    box.innerHTML=head+listHTML(list,b,getName(),20);
  }catch(e){ box.innerHTML=head+'<div class="rkSub">ランキングに接続できませんでした</div>'; }
}
$('#nameInput').value=getName();
$('#nameInput').oninput=e=>setName(e.target.value);
$('#rankBtn').onclick=()=>openRanking(
  mode==='ta' ? (tSel!=='custom'?'ta'+tSel:'ta30') : (qSel!=='custom'?'en'+qSel:'en10'));
$('#rkBack').onclick=()=>{ showBest(); show('start'); };

function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); $('#'+id).classList.add('active'); }

/* ================= game ================= */
function genQ(){
  const names=[...enabled], tot=names.reduce((s,n)=>s+CATS[n].w,0);
  for (let tries=0; tries<20; tries++){
    let r=Math.random()*tot, name=names[0];
    for (const n of names){ r-=CATS[n].w; if (r<=0){ name=n; break; } }
    try {
      const q=pick(CATS[name].gens)();
      if (q.answer>=0 && q.q!==lastQ && (q.type==='cmp' || q.choices.length===4)){ lastQ=q.q; return q; }
    } catch(e){}
  }
  return gSign();
}

function startGame(){
  duration=getDur(); qLimit=getQL();
  gameBoard = mode==='ta' ? (tSel==='custom'?null:'ta'+duration) : (qSel==='custom'?null:'en'+qLimit);
  hist=[]; correct=0; answered=0; streak=0; maxStreak=0; locked=false; lastQ='';
  $('#cCount').textContent='0'; $('#aCount').textContent='0'; $('#streak').textContent='';
  show('game'); running=true; tStart=performance.now();
  nextQ(); tick();
}

function tick(){
  if (!running) return;
  const now=performance.now();
  if (mode==='ta'){
    const left=Math.max(0, duration-(now-tStart)/1000);
    setTimer(left, duration, Math.min(5,duration/3));
    if (left<=0){ endGame(true); return; }
  } else if (!locked){
    const left=Math.max(0, qLimit-(now-qStart)/1000);
    setTimer(left, qLimit, Math.min(3,qLimit/3));
    if (left<=0){ answer(-1); }
  }
  raf=requestAnimationFrame(tick);
}
function setTimer(left, total, lowAt){
  $('#sec').textContent=left.toFixed(1);
  $('#barFill').style.width=(left/total*100)+'%';
  const low=left<=lowAt;
  $('#time').classList.toggle('low',low); $('#barFill').classList.toggle('low',low);
}

function nextQ(){
  cur=genQ(); locked=false;
  const card=$('#card'); card.classList.remove('ok','ng');
  $('#qCat').textContent=cur.cat;
  $('#qNo').textContent=`第${answered+1}問`;
  $('#qText').innerHTML=cur.q;
  const box=$('#choices'); box.innerHTML='';
  box.classList.toggle('cmp', cur.type==='cmp');
  cur.choices.forEach((c,i)=>{
    const b=document.createElement('button');
    b.className='choice'; b.innerHTML=`<span class="k">${i+1}</span>${c}`;
    b.onclick=()=>answer(i);
    box.appendChild(b);
  });
  qStart=performance.now();
}

function answer(i){   // i=-1 は時間切れ
  if (!running || locked) return;
  locked=true; answered++;
  const ok = i===cur.answer;
  if (ok){ correct++; streak++; maxStreak=Math.max(maxStreak,streak); } else streak=0;
  hist.push({ q:cur.q, type:cur.type, choices:cur.choices, chosen:i, answer:cur.answer, ok });
  $('#cCount').textContent=correct; $('#aCount').textContent=answered;
  $('#streak').textContent = streak>=3 ? `🔥 ${streak}連続正解` : '';
  const btns=$('#choices').children;
  btns[cur.answer].classList.add('right');
  if (i>=0 && !ok) btns[i].classList.add('wrong');
  $('#card').classList.add(ok?'ok':'ng');
  $('#mark').textContent= ok ? '○' : i<0 ? '時間切れ' : '×';
  $('#mark').style.fontSize = i<0 ? '24px' : '';
  fbTimer=setTimeout(()=>{ if (running) nextQ(); }, ok ? 260 : 750);
}

function endGame(timeUp){
  running=false; cancelAnimationFrame(raf); clearTimeout(fbTimer);
  const elapsed=(performance.now()-tStart)/1000;
  const p = answered ? Math.round(correct/answered*100) : 0;
  $('#resTitle').textContent = mode==='endless' ? 'エンドレス 結果' : timeUp ? 'タイムアップ！' : 'おつかれさま';
  $('#pct').textContent = answered ? p+'%' : '—';
  $('#sCorrect').textContent=correct;
  $('#sAns').textContent=answered;
  if (mode==='ta'){
    $('#sPaceL').textContent='1問あたり(秒)';
    $('#sPace').textContent = answered ? (Math.min(duration,elapsed)/answered).toFixed(1) : '-';
  } else {
    $('#sPaceL').textContent='最大連続正解';
    $('#sPace').textContent = maxStreak;
  }
  const arc=$('#ringArc'), C=502.65;
  arc.style.stroke = p>=90 ? '#1f9d55' : p>=70 ? '#e0a100' : '#d64545';
  arc.style.strokeDashoffset=C;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ arc.style.strokeDashoffset = C*(1-(answered?p/100:0)); }));
  $('#comment').textContent =
    !answered ? 'まだ1問も解いてないよ' :
    p===100 ? 'ノーミス！完璧' :
    p>=90 ? 'かなり正確。この調子' :
    p>=70 ? 'あと一歩。ミスした問題を見直そう' : 'スピードより正確さを意識してみよう';

  // best
  let nb='';
  if (mode==='ta' && timeUp && answered){
    const key='patto_best_'+duration, bst=store.get(key);
    if (!bst || correct>bst.c || (correct===bst.c && p>bst.p)){ store.set(key,{c:correct,p}); if (bst) nb='★ ベスト更新！'; }
  }
  if (mode==='endless' && maxStreak>0){
    const ek=ekey(qLimit), bst=store.get(ek);
    if (!bst || maxStreak>bst){ store.set(ek,maxStreak); if (bst) nb='★ 連続正解ベスト更新！'; }
  }
  $('#newBest').textContent=nb;

  // review
  const miss=hist.filter(h=>!h.ok), rv=$('#review');
  if (!answered){ rv.innerHTML='<div class="empty">解答した問題はありません</div>'; }
  else if (!miss.length){ rv.innerHTML='<h3>ミスした問題</h3><div class="empty">なし！全問正解 🎉</div>'; }
  else {
    rv.innerHTML = `<h3>ミスした問題（${miss.length}問）</h3>` + miss.map(h=>{
      const q = h.q.replace(/<span class="ask">/g,'<span class="ask">');
      const qq = h.type==='cmp'
        ? h.q.replace('<span class="box">?</span>', `<span class="box" style="border-style:solid;color:#1f9d55;border-color:#1f9d55">${h.choices[h.answer]}</span>`)
        : q;
      return `<div class="rv"><div class="rq">${qq}</div>
        <div class="ra"><span class="y">あなた：<span class="v">${h.chosen<0 ? '時間切れ' : h.choices[h.chosen]}</span></span>
        <span class="c">正解：<span class="v">${h.choices[h.answer]}</span></span></div></div>`;
    }).join('');
  }
  // online ranking
  const rb=$('#rankBox'); rb.style.display='none';
  const sc = mode==='ta' ? correct : maxStreak;
  const eligible = answered>0 && sc>0 && (mode==='endless' || timeUp);   // 0点・タイムアタックの途中終了は登録しない（自己ベスト未満でも登録する）
  if (!gameBoard){ rb.style.display='block'; rb.innerHTML='<div class="rkSub">カスタム時間はランキング対象外です</div>'; }
  else if (!sbOn()){ /* 未設定なら何も出さない */ }
  else if (eligible) rankFlow(sc,p,gameBoard);
  show('result');
}

$('#startBtn').onclick=startGame;
$('#retryBtn').onclick=startGame;
$('#backBtn').onclick=()=>{ showBest(); show('start'); };
$('#quitBtn').onclick=()=>{ if (running) endGame(false); };
document.addEventListener('keydown',e=>{
  if (running){
    const n=parseInt(e.key,10);
    if (n>=1 && n<=cur.choices.length) answer(n-1);
    if (e.key==='Escape') endGame(false);
  } else if (e.key==='Enter' && $('#start').classList.contains('active') || e.key==='Enter' && $('#result').classList.contains('active')){
    if (e.target.tagName!=='INPUT') startGame();
  }
});
</script>
</body>
</html>
